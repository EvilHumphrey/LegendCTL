name: Release build (CI-built, attested)

# Builds the LegendCTL release artifacts IN PUBLIC CI, generates the checksum
# manifest, attests build provenance for the binaries, and creates a DRAFT
# GitHub release with everything attached.
#
# Why CI-built: an artifact attestation is an SLSA build-provenance claim —
# "these exact bytes were produced by this workflow run." That claim is only
# honest if the workflow actually builds the published bytes. So from the
# first release this workflow ships, the release binaries ARE the CI-built
# ones. (Earlier releases were built on the maintainer's machine and uploaded
# by hand — same SHA-256 discipline, but provenance wasn't machine-checkable.)
#
# What deliberately stays HUMAN:
#   - The draft release is NOT auto-published. The maintainer downloads the
#     CI-built Setup.exe from the draft, installs it, smokes it on real
#     hardware, and only then publishes the release (which is when
#     /releases/latest starts serving it). An unsmoked binary never goes
#     public.
#
# Triggers:
#   - push of a version tag (v*): full run — build + attest + draft release.
#   - push to a ci-dryrun/** branch: build-only rehearsal (no attestation,
#     no release) — proves the CI build path without touching anything
#     public.
#   - workflow_dispatch: the same build-only rehearsal, runnable from the
#     Actions tab once this file is on the default branch.
#
# Job split (least privilege): the `build` job holds contents:read ONLY and
# runs for every trigger — so rehearsals and any future compromise of the
# build path never see a write-capable token or the OIDC identity. The
# `release` job (tag pushes only) is the sole holder of contents:write +
# id-token:write + attestations:write; it attests and drafts the release from
# the build job's artifact after re-verifying the hashes. No third-party
# release action — the preinstalled gh CLI does the release step — so the
# only non-actions/* link in the build trust chain is Inno Setup (installed
# from chocolatey at build time, pinned below).
#
# An attested release must not skip the honesty gates: the build job runs the
# same summary-based unittest suite and pip-audit CVE gate as ci.yml BEFORE
# building. (ci.yml only runs on push/PR to main, not on tags — without this
# mirror, a tag push would build and attest unverified code.)
#
# Supply-chain pins:
#   - runs-on is pinned to `windows-2025`, the image family the proven-good
#     CI run used (run 28626143061 resolved windows-latest to image
#     "windows-2025-vs2026", version 20260628.158.1 — since June 2026 the
#     `windows-2025` label serves that same Windows Server 2025 + VS2026
#     image, while `windows-latest` is free to move to whatever comes next).
#   - Inno Setup is pinned (chocolatey package 6.7.1) and asserted
#     post-install, matching the maintainer's local 6.7.1 so CI builds and
#     local builds are the same toolchain.
#   - ACCEPTED RISK (deliberate, documented): Python dependencies are
#     version-pinned via requirements.txt / requirements-build.txt but NOT
#     hash-pinned (no pip --require-hashes / pip-compile --generate-hashes).
#     Full hash-locking of the transitive tree is a maintenance burden
#     disproportionate to this project today; revisit if byte-reproducible
#     builds become a goal. Standing mitigations: exact version pins,
#     Dependabot freshness, and the pip-audit gate in this workflow.
#   - CPython: pinned exactly to 3.13.14, the 2026-07-03 CVE sweep's primary
#     recommendation. Staying on 3.12 was preferred (all local suite evidence
#     is 3.12) but is not securable in CI: 3.12 is in security-only phase and
#     ships NO Windows binaries past 3.12.10 (python.org and the setup-python
#     manifest both — verified 2026-07-04 after a failed preflight assert on
#     the windows-2025 toolcache's 3.12.10). Mitigation for the runtime bump:
#     the full unittest suite runs on 3.13.14 in this workflow BEFORE the
#     build, and the operator hardware-smokes the built Setup before publish.
#     The "Assert Python security-patch floor" step fails the build below
#     3.13.14. The CVE-sweep-flagged stdlib modules (webbrowser/gzip/bz2/
#     lzma/http.client) are not imported by the app; an automated
#     import-graph exclusion assert is DEFERRED (PyInstaller's own tooling
#     may legitimately pull archive modules, and an untested assert must not
#     false-fail a tag run).

on:
  push:
    tags: ["v*"]
    branches: ["ci-dryrun/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false # never kill a release build mid-flight

jobs:
  build:
    name: Test-gate + build (Windows · Python 3.13)
    runs-on: windows-2025
    permissions:
      contents: read # build + rehearsal runs never hold a write-capable token

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Exact pin (see the CPython supply-chain note in the header). Keep
          # in sync with the floor asserted below.
          python-version: '3.13.14'
          cache: pip

      - name: Assert Python security-patch floor
        shell: pwsh
        run: |
          python -c "import sys; v = '%d.%d.%d' % sys.version_info[:3]; assert sys.version_info >= (3, 13, 14), 'CPython ' + v + ' is below the 3.13.14 security floor (2026-07-03 CVE sweep)'; print('CPython ' + v + ' meets the 3.13.14 floor')"

      - name: Guard — tag matches the source version (tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          # Never interpolate ${{ github.ref_name }} directly into a run script:
          # a tag name is attacker-controllable text and git accepts shell
          # metacharacters in it, so inline interpolation is a script-injection
          # surface. Pass it through the environment and read $env:REF_NAME.
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:REF_NAME
          # Strict allowlist: only vMAJOR.MINOR.PATCH tags may build a release.
          # This also neutralizes any exotic tag name before it is used anywhere.
          # The release job below runs only after this job succeeds (needs:),
          # so a tag that fails this allowlist never reaches the write-token job.
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Refusing to build: tag '$tag' is not a vMAJOR.MINOR.PATCH release tag."
          }
          $versionPy = Get-Content "zd_app\version.py" -Raw
          if ($versionPy -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "Could not parse __version__ from zd_app\version.py"
          }
          $version = $Matches[1]
          if ("v$version" -ne $tag) {
            throw "Tag $tag does not match zd_app/version.py __version__=$version — refusing to build a mislabeled release."
          }

      - name: Install runtime dependencies (test gate)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite before building (constraint gates included)
        shell: pwsh
        run: |
          # Mirrors ci.yml exactly: an attested "trustworthy" release that
          # skipped the honesty/constraint gates would be self-contradictory.
          # Pass/fail comes from the unittest *summary line*, not the raw exit
          # code — exit code 139 on teardown is a known DPG segfault artifact,
          # not a failure (docs/ARCHITECTURE.md, "Test architecture").
          # unittest writes its output to stderr, hence 2>&1.
          $ErrorActionPreference = 'Continue'
          python -m unittest discover -s tests 2>&1 | Tee-Object -FilePath test_output.txt
          $code = $LASTEXITCODE
          $log  = Get-Content test_output.txt -Raw

          if ($log -match '(?m)^FAILED \(') {
            Write-Host "::error::unittest reported FAILED — see summary above."
            exit 1
          }
          elseif ($log -match '(?m)^OK\b') {
            Write-Host "Suite PASSED. (process exit code = $code; 139 = known DPG teardown artifact, ignored)"
            exit 0
          }
          else {
            Write-Host "::error::No unittest 'OK' summary found (exit code $code). Likely a crash/segfault BEFORE the summary — investigate; do not treat as green."
            exit 1
          }

      - name: Audit dependencies for known CVEs before building (pip-audit)
        run: |
          # Mirrors ci.yml's audit job. Same triage pattern applies: suppress a
          # non-applicable finding with a written --ignore-vuln reason rather
          # than dropping the gate.
          python -m pip install --upgrade pip-audit
          pip install -r requirements-build.txt
          pip-audit

      - name: Create the build venv (.venv-zd)
        shell: pwsh
        run: |
          # tools/build_release.ps1 expects the repo-root venv .venv-zd and
          # itself installs the pinned build toolchain into it
          # (requirements-build.txt, which chains requirements.txt).
          python -m venv .venv-zd

      - name: Install Inno Setup 6 (pinned 6.7.1)
        shell: pwsh
        run: |
          # build_release.ps1 discovers ISCC.exe at the standard
          # "C:\Program Files (x86)\Inno Setup 6\" install path — which is
          # where chocolatey's innosetup package installs it.
          # Pinned to the package version that installs Inno Setup 6.7.1 —
          # the maintainer's local version — so the shipped+attested bytes
          # don't float with chocolatey's latest.
          choco install innosetup --version 6.7.1 --no-progress -y

      - name: Assert Inno Setup version is exactly 6.7.1
        shell: pwsh
        run: |
          # Assert via the uninstall registry DisplayVersion (with the ISCC
          # banner line as fallback). Deliberately NOT the ISCC.exe file
          # resource: ISCC.exe ships no version resource, so its FileVersion
          # reads 0.0.0.0.
          $expected = '6.7.1'
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
          )
          $display = $null
          foreach ($k in $keys) {
            if (Test-Path -LiteralPath $k) {
              $display = (Get-ItemProperty -LiteralPath $k).DisplayVersion
              break
            }
          }
          if (-not $display) {
            # Fallback: parse the compiler banner (first line, e.g.
            # "Inno Setup 6 Command-Line Compiler ... 6.7.1 ...").
            $banner = & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" 2>&1 | Select-Object -First 2 | Out-String
            if ($banner -match '(\d+\.\d+\.\d+)') { $display = $Matches[1] }
          }
          if (-not $display) { throw "Could not determine the installed Inno Setup version (registry key missing and banner unparseable)." }
          if ($display -ne $expected) { throw "Inno Setup version drift: installed '$display', pinned '$expected' — refusing to build." }
          Write-Host "Inno Setup $display confirmed (pinned $expected)."

      - name: Build release artifacts (PyInstaller + Inno Setup)
        shell: pwsh
        run: |
          # The same script the maintainer runs locally. Its trailing
          # install_local.ps1 step (Desktop/Start-Menu shortcut refresh) is
          # meaningless on a runner but warn-guarded — a shortcut hiccup
          # cannot fail the build.
          & tools\build_release.ps1

      - name: Guard — exactly one installer and one portable zip built
        shell: pwsh
        run: |
          # build_release.ps1 only WARNS when ISCC.exe is missing and then
          # produces a zip-only dist. A release without the Setup.exe is
          # wrong, so that path is a hard failure here. We also require
          # EXACTLY ONE of each: a stray/extra *-Setup.exe or *-windows.zip
          # must fail closed rather than be silently hashed, attested, and
          # published. The two resolved paths are exported so every later
          # step hashes exactly these bytes (no re-globbing).
          $setup = @(Get-ChildItem dist\*-Setup.exe -ErrorAction SilentlyContinue)
          $zip   = @(Get-ChildItem dist\*-windows.zip -ErrorAction SilentlyContinue)
          if ($setup.Count -ne 1) { throw "Expected exactly one dist\*-Setup.exe, found $($setup.Count) — refusing to release." }
          if ($zip.Count   -ne 1) { throw "Expected exactly one dist\*-windows.zip, found $($zip.Count) — refusing to release." }
          "SETUP_PATH=$($setup[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_PATH=$($zip[0].FullName)"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Regenerate SHA256SUMS.txt (documented shasum binary format)
        shell: pwsh
        run: |
          # Re-hash the actual dist artifacts on this runner and write the
          # manifest in the exact format actions/attest-build-provenance
          # documents for subject-checksums (lowercase hex + " *" binary-mode
          # marker). This one file is BOTH the attestation subject list and
          # the published checksums asset, so what users verify is
          # byte-identical to what was attested.
          # Written with explicit LF line endings: Set-Content on Windows
          # emits CRLF, and a subject-checksums parser that doesn't strip \r
          # would record subtly wrong subject names in the attestation.
          # Use the exact two paths the guard resolved — never re-glob, so the
          # attested subject set is provably the same two files that passed the
          # count guard.
          $paths = @("$env:SETUP_PATH", "$env:ZIP_PATH")
          $lines = foreach ($p in $paths) {
            $fi = Get-Item -LiteralPath $p
            $h = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLower()
            "$h *$($fi.Name)"
          }
          [IO.File]::WriteAllText((Join-Path $PWD "dist\SHA256SUMS.txt"), (($lines -join "`n") + "`n"))
          Get-Content dist\SHA256SUMS.txt

      - name: Upload dist as a workflow artifact (all runs, incl. rehearsals)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legendctl-dist-${{ github.run_number }}
          path: |
            dist/*-Setup.exe
            dist/*-windows.zip
            dist/SHA256SUMS.txt
          retention-days: 14

  release:
    name: Attest + draft release (tag runs only)
    # Tag pushes only — rehearsal runs never reach this job, so the write
    # permissions below never exist for a ci-dryrun/** or dispatch run.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write # draft-release creation + asset upload
      id-token: write # OIDC identity for sigstore signing (attest step)
      attestations: write # store the attestation (attest step)

    steps:
      - name: Checkout
        # Needed for RELEASE_NOTES_<tag>.md and gh --verify-tag.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download the built dist from the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: legendctl-dist-${{ github.run_number }}
          path: dist

      - name: Guard — re-verify the downloaded artifacts against SHA256SUMS.txt
        shell: pwsh
        run: |
          # The artifacts crossed a job boundary (via workflow-artifact
          # storage). Before attesting, prove the bytes we are about to attest
          # and publish are exactly the bytes the build job hashed: same
          # exactly-one-of-each rule, then every manifest line must match a
          # fresh hash of the downloaded file. Fail closed on any drift.
          $manifest = @(Get-Content dist\SHA256SUMS.txt | Where-Object { $_ -ne '' })
          if ($manifest.Count -ne 2) { throw "Expected exactly 2 manifest lines in SHA256SUMS.txt, found $($manifest.Count)." }
          $setup = @(Get-ChildItem dist\*-Setup.exe -ErrorAction SilentlyContinue)
          $zip   = @(Get-ChildItem dist\*-windows.zip -ErrorAction SilentlyContinue)
          if ($setup.Count -ne 1) { throw "Expected exactly one dist\*-Setup.exe after download, found $($setup.Count)." }
          if ($zip.Count   -ne 1) { throw "Expected exactly one dist\*-windows.zip after download, found $($zip.Count)." }
          foreach ($f in @($setup[0], $zip[0])) {
            $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLower()
            $line = "$h *$($f.Name)"
            if ($manifest -notcontains $line) {
              throw "Hash mismatch after artifact transfer for $($f.Name) — refusing to attest/publish."
            }
          }
          "SETUP_PATH=$($setup[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_PATH=$($zip[0].FullName)"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Downloaded artifacts match the build job's manifest."

      - name: Attest build provenance for the release binaries
        id: attest_release
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          # subject-path (not subject-checksums): the checksums parser
          # mis-handled our LF-only shasum binary-format file in the first
          # v2.5.0 run — it collapsed both lines into ONE subject (Setup's
          # digest, garbled multi-line name), leaving the zip unattested.
          # Attesting from the file bytes needs no parser and cannot skew;
          # the digests these files carry were already re-verified against
          # the build job's SHA256SUMS.txt two steps above.
          subject-path: |
            dist/ZDUltimateLegend-v*-Setup.exe
            dist/ZDUltimateLegend-v*-windows.zip

      - name: Stage the attestation bundle as a release asset
        shell: pwsh
        env:
          # Action outputs are also untrusted text — pass via env + -LiteralPath.
          BUNDLE_PATH: ${{ steps.attest_release.outputs.bundle-path }}
        run: |
          # The bundle enables OFFLINE verification (gh attestation verify
          # --bundle ...) without querying the GitHub API. A stable asset
          # name keeps the install-guide instructions copy-pasteable.
          Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination dist\attestation-bundle.jsonl

      - name: Create DRAFT release with assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # REF_NAME passed via env (same injection rule as the build job);
          # the build job's strict allowlist already validated this tag —
          # this job cannot run unless that guard passed.
          $tag = $env:REF_NAME
          $notes = "RELEASE_NOTES_$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing $notes — a release ships with real, written notes or not at all."
          }
          # Upload exactly the two guard-resolved binaries (via env), plus the
          # checksum manifest and the offline attestation bundle.
          gh release create $tag `
            --draft `
            --verify-tag `
            --title "LegendCTL $tag" `
            --notes-file $notes `
            "$env:SETUP_PATH" `
            "$env:ZIP_PATH" `
            "dist\SHA256SUMS.txt" `
            "dist\attestation-bundle.jsonl"
