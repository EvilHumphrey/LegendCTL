name: CI

# Runs the LegendCTL test suite — INCLUDING the constraint-architecture gates
# (forbidden-phrase, field-registry drift, i18n parity, shipped-source hygiene)
# documented in docs/ARCHITECTURE.md. Those gates are what make the project's
# "no drivers / no input injection / no network / verified writes / no maintainer
# username in shipped source" claims *enforced* rather than aspirational. A red
# check here means a security/honesty constraint regressed — treat it as blocking.
#
# Destination in the public repo: .github/workflows/ci.yml
# Default branch assumed to be `main`; adjust the `branches:` filters if different.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token. PR CI only needs to read the checked-out tree. Never
# escalate to `write` here — this workflow runs untrusted code from fork PRs.
# (We use `pull_request`, NOT `pull_request_target`, so fork code never sees
# repo secrets.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite (Windows · Python 3.12)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite (constraint gates included)
        shell: pwsh
        run: |
          # tests/__init__.py installs a shared Dear PyGui context shim so
          # `unittest discover` runs clean in a single process. Historically a
          # DPG teardown segfault could still surface as process exit code 139
          # AFTER every test passed and the summary printed. So we decide
          # The shared evaluator requires a real `Ran ...` + `OK` summary and
          # combines it with the process exit code. Only exit 0 and the
          # documented post-summary DPG teardown artifact (139 or Windows'
          # signed/unsigned 0xC0000005 form) are allowed.
          # unittest writes to stderr, hence 2>&1.
          $ErrorActionPreference = 'Continue'
          python -m unittest discover -s tests 2>&1 | Tee-Object -FilePath test_output.txt
          $code = $LASTEXITCODE
          & .\.github\scripts\evaluate-unittest-result.ps1 `
            -LogPath test_output.txt `
            -ProcessExitCode $code `
            -MinimumTestCount 3000
          exit $LASTEXITCODE

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-output
          path: test_output.txt
          retention-days: 14

  audit:
    name: Dependency CVE audit (pip-audit)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Create isolated audit environment
        shell: pwsh
        run: |
          python -m venv .venv-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download and install the hash-locked audit closure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .audit-wheelhouse | Out-Null
          .\.venv-audit\Scripts\python.exe -m pip download --disable-pip-version-check --only-binary=:all: --no-deps `
            --require-hashes --dest .audit-wheelhouse -r requirements-release.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-audit\Scripts\python.exe -m pip install --disable-pip-version-check --no-index --find-links .audit-wheelhouse `
            --only-binary=:all: --no-deps --require-hashes -r requirements-release.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-audit\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit installed environment for known CVEs
        # requirements-build.txt itself asks for this before tagging a release;
        # this makes it continuous. Dependabot (see .github/dependabot.yml) keeps
        # the pins fresh between audits.
        #
        # Audit the same isolated closure that passed pip check; audit failures
        # remain blocking and require review before dependency changes.
        shell: pwsh
        run: |
          .\.venv-audit\Scripts\python.exe -m pip_audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
