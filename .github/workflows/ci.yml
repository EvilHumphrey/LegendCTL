name: CI

# Runs the LegendCTL test suite — INCLUDING the constraint-architecture gates
# (forbidden-phrase, field-registry drift, i18n parity, shipped-source hygiene)
# documented in docs/ARCHITECTURE.md. Those gates are what make the project's
# "no drivers / no input injection / no network / verified writes / no maintainer
# username in shipped source" claims *enforced* rather than aspirational. A red
# check here means a security/honesty constraint regressed — treat it as blocking.
#
# Destination in the public repo: .github/workflows/ci.yml
# Default branch assumed to be `main`; adjust the `branches:` filters if different.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token. PR CI only needs to read the checked-out tree. Never
# escalate to `write` here — this workflow runs untrusted code from fork PRs.
# (We use `pull_request`, NOT `pull_request_target`, so fork code never sees
# repo secrets.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_windows:
    name: Test suite (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Download and install the hash-locked test closure
        shell: pwsh
        run: |
          python -m venv .venv-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path .test-wheelhouse | Out-Null
          .\.venv-test\Scripts\python.exe -m pip download --disable-pip-version-check --only-binary=:all: --no-deps `
            --require-hashes --dest .test-wheelhouse -r requirements-release.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-test\Scripts\python.exe -m pip install --disable-pip-version-check --no-index --find-links .test-wheelhouse `
            --only-binary=:all: --no-deps --require-hashes -r requirements-release.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-test\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run test suite (constraint gates included)
        shell: pwsh
        run: |
          # DearPyGui occasionally exits with code 139 / 0xC0000005 during
          # C-level teardown after unittest prints a complete OK summary.
          # The shared exit-code evaluator accepts only a complete terminal OK
          # summary meeting the minimum test count, never an early crash.
          $ErrorActionPreference = 'Continue'
          .\.venv-test\Scripts\python.exe -m unittest discover -s tests 2>&1 | Tee-Object -FilePath test_output_windows.txt
          $code = $LASTEXITCODE
          & .\.github\scripts\evaluate-unittest-result.ps1 `
            -LogPath test_output_windows.txt `
            -ProcessExitCode $code `
            -MinimumTestCount 3000
          exit $LASTEXITCODE

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-output-windows
          path: test_output_windows.txt
          retention-days: 14

  audit:
    name: Dependency CVE audit (pip-audit)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'

      - name: Create isolated audit environment
        shell: pwsh
        run: |
          python -m venv .venv-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download and install the hash-locked release audit closure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .audit-wheelhouse | Out-Null
          .\.venv-audit\Scripts\python.exe -m pip download --disable-pip-version-check --only-binary=:all: --no-deps `
            --require-hashes --dest .audit-wheelhouse -r requirements-release.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-audit\Scripts\python.exe -m pip install --disable-pip-version-check --no-index --find-links .audit-wheelhouse `
            --only-binary=:all: --no-deps --require-hashes -r requirements-release.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-audit\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify hash-locked lock-refresher tooling closure
        shell: pwsh
        run: |
          python -m venv .venv-lock-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path .lock-tools-wheelhouse | Out-Null
          .\.venv-lock-tools\Scripts\python.exe -m pip download --disable-pip-version-check --only-binary=:all: --no-deps `
            --require-hashes --dest .lock-tools-wheelhouse -r requirements-lock-tools.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-lock-tools\Scripts\python.exe -m pip install --disable-pip-version-check --no-index --find-links .lock-tools-wheelhouse `
            --only-binary=:all: --no-deps --require-hashes -r requirements-lock-tools.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-lock-tools\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit release and lock-refresher closures for known CVEs
        shell: pwsh
        run: |
          .\.venv-audit\Scripts\python.exe -m pip_audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-audit\Scripts\python.exe -m pip_audit -r requirements-lock-tools.lock --no-deps --disable-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
