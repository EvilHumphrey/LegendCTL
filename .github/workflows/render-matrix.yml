name: Full render matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '43 10 * * 2'

permissions:
  contents: read

concurrency:
  group: full-render-matrix
  cancel-in-progress: true

jobs:
  render-matrix:
    name: All font-pressure render cells
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      ZD_RENDER_MATRIX: full

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run all render cells
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m unittest tests.test_font_scale_proxy_render_matrix 2>&1 |
            Tee-Object -FilePath render_matrix_output.txt
          $code = $LASTEXITCODE
          & .\.github\scripts\evaluate-unittest-result.ps1 `
            -LogPath render_matrix_output.txt `
            -ProcessExitCode $code `
            -MinimumTestCount 40
          exit $LASTEXITCODE

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-render-matrix-log
          path: render_matrix_output.txt
          if-no-files-found: warn
